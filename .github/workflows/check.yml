# Сборка и тесты на каждый пуш. Движки здесь не запускаются: тесты подменяют их
# заглушками, поэтому проверка бесплатная и не зависит от чужих подписок.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test
