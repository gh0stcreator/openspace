<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root { color-scheme: dark; background: oklch(0.145 0 0) }
      :root:not(.dark) { color-scheme: light; background: #fff }
    </style>
    <!-- До первого рендера React: без этого при загрузке на миг мелькнёт светлая
         тема, пока ThemeProvider не применит класс из localStorage. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "dark"
          var dark = stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
        } catch (e) {}
      })()
    </script>
    <title>Openspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
